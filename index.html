<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131b">
<title>4,000 Weeks</title>
<link rel="manifest" href="./manifest.webmanifest">

<style>
:root{
  color-scheme:dark;
  --bg:#10131b;--panel:#1a1f2b;--muted:#aab2c2;--text:#f4f6fb;
  --past:#78849a;--current:#f4c95d;--future:#30394a;
  --accent:#9db7ff;--sleep:#8b5cf6;--sleep-share:33.3%;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,sans-serif}
main{max-width:760px;margin:auto;padding:14px}
header{position:sticky;top:0;z-index:5;background:rgba(16,19,27,.96);backdrop-filter:blur(10px);padding:10px 0 12px;border-bottom:1px solid #303747}
h1{font-size:22px;margin:0 0 3px}
.sub{font-size:13px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid #303747;border-radius:14px;padding:13px;margin:12px 0}
label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
input,select,button{font:inherit;border-radius:10px;border:1px solid #46516a;padding:11px;background:#111722;color:var(--text)}
input,select{width:100%}
button{cursor:pointer;background:#29344a}
button.primary{background:#d9e3ff;color:#151a25;border:0;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.actions button{flex:1;min-width:130px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:#111722;border-radius:10px;padding:9px}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--muted)}
.progress{height:8px;background:#30394a;border-radius:20px;overflow:hidden;margin-top:10px}
